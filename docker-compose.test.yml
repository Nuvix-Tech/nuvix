# this docker-compose file is used for running tests in CI/CD pipelines or local testing environments

name: nuvix-test
services:
  postgres:
    image: nuvix/postgres
    container_name: nuvix-test-postgres
    env_file:
      - .env.test
    environment:
      POSTGRES_PASSWORD: test_admin
    networks:
      - nuvix-test
    ports:
      - "${TEST_DB_PORT:-54321}:5432"

  redis:
    image: redis:latest
    container_name: nuvix-test-redis
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - ./configs/redis.conf:/usr/local/etc/redis/redis.conf
    env_file:
      - .env.test
    networks:
      - nuvix-test
    ports:
      - "${TEST_REDIS_PORT:-63791}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  nuvix-test:
    driver: bridge
