# this file is used for local development only
# if you want to deploy nuvix in production, please refer to the documentation
# https://docs.nuvix.in/deployment/docker

name: nuvix
services:
  postgres:
    image: nuvix/postgres
    container_name: nuvix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${NUVIX_DATABASE_PASSWORD}
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nuvix

  redis:
    image: redis
    container_name: redis
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    volumes:
      - ./configs/redis.conf:/usr/local/etc/redis/redis.conf
      - redis_data:/data
    restart: unless-stopped
    networks:
      - nuvix
    ports:
      - "6379:6379"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # pgcat:
  #   image: ghcr.io/postgresml/pgcat:latest
  #   container_name: nuvix-pgcat
  #   ports:
  #     - "9930:9930"  # Metrics port
  #     - "6432:6432"  
  #   environment:
  #     NUVIX_PGCAT_ADMIN_USER: ${NUVIX_PGCAT_ADMIN_USER:-admin}
  #     NUVIX_PGCAT_ADMIN_PASSWORD: ${NUVIX_PGCAT_ADMIN_PASSWORD:-password}
  #     NUVIX_DATABASE_PASSWORD: ${NUVIX_DATABASE_PASSWORD}
  #     NUVIX_DATABASE_ADMIN_PASSWORD: ${NUVIX_DATABASE_ADMIN_PASSWORD}
  #     NUVIX_DATABASE_POOL_HOST: localhost
  #     NUVIX_DATABASE_POOL_PORT: 6432
  #     NUVIX_DATABASE_HOST: postgres
  #     NUVIX_DATABASE_PORT: 5432
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./configs/pgcat.toml.template:/etc/pgcat/pgcat.toml.template:ro
  #     - ./configs/pgcat-entrypoint.sh:/usr/local/bin/pgcat-entrypoint.sh:ro
  #   networks:
  #     - nuvix
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   entrypoint: ["/usr/local/bin/pgcat-entrypoint.sh"]

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        - APP_NAME=server
    container_name: server
    ports:
      - '4000:4000'
    env_file:
      - .env
    environment:
      NUVIX_DATABASE_HOST: postgres
      NUVIX_DATABASE_POOL_HOST: pgcat
      NUVIX_REDIS_HOST: redis
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nuvix
    volumes:
      - nuvix_storage:/app/storage
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'
    
  platform:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        - APP_NAME=platform
    container_name: platform
    ports:
      - '4100:4100'
    env_file:
      - .env
    environment:
      NUVIX_DATABASE_HOST: postgres
      NUVIX_DATABASE_POOL_HOST: pgcat
      NUVIX_REDIS_HOST: redis
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nuvix
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

volumes:
  postgres_data:
  nuvix_storage:
  redis_data:

networks:
  nuvix:
    driver: bridge
